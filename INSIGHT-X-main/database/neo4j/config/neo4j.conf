# Neo4j Configuration for INSIGHT-X
# Optimized for graph traversal and relationship queries

# ============================================================================
# NETWORK SETTINGS
# ============================================================================
dbms.default_listen_address=0.0.0.0
dbms.connector.bolt.enabled=true
dbms.connector.bolt.listen_address=:7687
dbms.connector.http.enabled=true
dbms.connector.http.listen_address=:7474
dbms.connector.https.enabled=true
dbms.connector.https.listen_address=:7473

# ============================================================================
# MEMORY SETTINGS (for 16GB RAM instance)
# ============================================================================
# Heap: 8GB initial and max
dbms.memory.heap.initial_size=8g
dbms.memory.heap.max_size=8g

# Page cache: 4GB (for better graph traversal performance)
dbms.memory.pagecache.size=4g

# Transaction state
dbms.memory.transaction.global_max_size=2g
dbms.memory.transaction.database_max_size=1g

# ============================================================================
# CLUSTERING (Causal Cluster for HA)
# ============================================================================
# Cluster discovery
dbms.mode=CORE
causal_clustering.minimum_core_cluster_size_at_formation=3
causal_clustering.minimum_core_cluster_size_at_runtime=3

# Initial discovery members
causal_clustering.initial_discovery_members=neo4j-core-1:5000,neo4j-core-2:5000,neo4j-core-3:5000

# Cluster addresses
causal_clustering.discovery_listen_address=0.0.0.0:5000
causal_clustering.transaction_listen_address=0.0.0.0:6000
causal_clustering.raft_listen_address=0.0.0.0:7000

# Advertised addresses (for external access)
causal_clustering.discovery_advertised_address=${NEO4J_ADVERTISED_ADDRESS}:5000
causal_clustering.transaction_advertised_address=${NEO4J_ADVERTISED_ADDRESS}:6000
causal_clustering.raft_advertised_address=${NEO4J_ADVERTISED_ADDRESS}:7000

# Read replica settings
causal_clustering.read_replica_count=2

# ============================================================================
# QUERY TUNING
# ============================================================================
# Cypher query tuning
cypher.min_replan_interval=10s
cypher.statistics_divergence_threshold=0.5

# Query execution
dbms.transaction.timeout=300s
dbms.lock.acquisition.timeout=60s

# Query logging (log slow queries > 5 seconds)
dbms.logs.query.enabled=true
dbms.logs.query.threshold=5s
dbms.logs.query.parameter_logging_enabled=true

# ============================================================================
# PERFORMANCE
# ============================================================================
# Bolt thread pool
dbms.connector.bolt.thread_pool_min_size=50
dbms.connector.bolt.thread_pool_max_size=400

# Transaction pool
dbms.transaction.concurrent.maximum=1000

# Checkpoint settings
dbms.checkpoint.interval.time=15m
dbms.checkpoint.interval.tx=100000

# ============================================================================
# APOC CONFIGURATION
# ============================================================================
# Enable APOC procedures
dbms.security.procedures.unrestricted=apoc.*,gds.*
dbms.security.procedures.allowlist=apoc.*,gds.*

# APOC import/export
apoc.export.file.enabled=true
apoc.import.file.enabled=true
apoc.import.file.use_neo4j_config=true

# APOC trigger
apoc.trigger.enabled=true

# TTL (Time-to-Live) for automatic cleanup
apoc.ttl.enabled=true
apoc.ttl.schedule=30

# ============================================================================
# GRAPH DATA SCIENCE (GDS) CONFIGURATION
# ============================================================================
gds.enterprise.license_file=/licenses/gds-license.txt

# GDS memory settings
gds.arrow.enabled=true
gds.arrow.listen_address=0.0.0.0:8491

# ============================================================================
# SECURITY
# ============================================================================
# Authentication and authorization
dbms.security.auth_enabled=true
dbms.security.auth_provider=native

# SSL/TLS
dbms.ssl.policy.bolt.enabled=true
dbms.ssl.policy.bolt.base_directory=/var/lib/neo4j/certificates/bolt
dbms.ssl.policy.bolt.client_auth=NONE

# ============================================================================
# LOGGING
# ============================================================================
dbms.logs.debug.level=INFO
dbms.logs.http.enabled=true
dbms.logs.gc.enabled=true

# Log rotation
dbms.logs.debug.rotation.size=20m
dbms.logs.debug.rotation.keep_number=7

# ============================================================================
# METRICS
# ============================================================================
# Prometheus metrics export
metrics.enabled=true
metrics.prometheus.enabled=true
metrics.prometheus.endpoint=0.0.0.0:2004

# CSV metrics (alternative)
metrics.csv.enabled=true
metrics.csv.interval=30s
metrics.csv.path=/var/lib/neo4j/metrics

# ============================================================================
# BACKUP
# ============================================================================
# Online backup (Enterprise feature)
dbms.backup.enabled=true
dbms.backup.listen_address=0.0.0.0:6362

# ============================================================================
# DATABASE CONFIGURATION
# ============================================================================
# Default database
dbms.default_database=insightx

# Database directories
dbms.directories.data=/var/lib/neo4j/data
dbms.directories.logs=/var/log/neo4j
dbms.directories.metrics=/var/lib/neo4j/metrics
dbms.directories.import=/var/lib/neo4j/import
dbms.directories.plugins=/var/lib/neo4j/plugins

# ============================================================================
# ADVANCED OPTIONS
# ============================================================================
# JVM additional arguments
dbms.jvm.additional=-XX:+UseG1GC
dbms.jvm.additional=-XX:+ExitOnOutOfMemoryError
dbms.jvm.additional=-XX:+UseStringDeduplication
dbms.jvm.additional=-Dneo4j.ext.udc.source=kubernetes

# Timezone
db.temporal.timezone=UTC
