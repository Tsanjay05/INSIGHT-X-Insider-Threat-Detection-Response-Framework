# PostgreSQL Host-Based Authentication Configuration
# TYPE  DATABASE        USER            ADDRESS                 METHOD

# Local connections
local   all             postgres                                peer
local   all             all                                     scram-sha-256

# IPv4 local connections
host    all             all             127.0.0.1/32            scram-sha-256

# IPv6 local connections
host    all             all             ::1/128                 scram-sha-256

# Application connections from Kubernetes pods
host    insightx_trust  insightx_app    10.0.0.0/8              scram-sha-256
host    insightx_trust  insightx_app    172.16.0.0/12           scram-sha-256

# Replication connections
host    replication     replicator      10.0.0.0/8              scram-sha-256
host    replication     replicator      172.16.0.0/12           scram-sha-256

# Admin connections (from bastion host or VPN)
hostssl all             insightx_admin  10.0.0.0/8              scram-sha-256
hostssl all             insightx_admin  172.16.0.0/12           scram-sha-256

# Monitoring connections
host    postgres        prometheus      10.0.0.0/8              scram-sha-256
host    postgres        prometheus      172.16.0.0/12           scram-sha-256

# Deny all other connections
host    all             all             0.0.0.0/0               reject
host    all             all             ::/0                    reject
