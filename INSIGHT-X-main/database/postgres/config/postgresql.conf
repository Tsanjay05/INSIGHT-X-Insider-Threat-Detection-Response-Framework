# PostgreSQL Configuration for INSIGHT-X Trust Engine
# Optimized for OLTP workload with streaming replication

# =============================================================================
# CONNECTION SETTINGS
# =============================================================================
listen_addresses = '*'
port = 5432
max_connections = 200
superuser_reserved_connections = 10

# Connection pooling (use with PgBouncer)
reserved_connections = 10

# =============================================================================
# MEMORY SETTINGS
# =============================================================================
# Assumes 16GB RAM dedicated to PostgreSQL
shared_buffers = 4GB
effective_cache_size = 12GB
work_mem = 64MB
maintenance_work_mem = 1GB
huge_pages = try

# =============================================================================
# WAL (Write-Ahead Log) SETTINGS
# =============================================================================
wal_level = replica
wal_log_hints = on
max_wal_senders = 10
max_replication_slots = 10
wal_keep_size = 1GB

# WAL archiving
archive_mode = on
archive_command = 'test ! -f /var/lib/postgresql/wal_archive/%f && cp %p /var/lib/postgresql/wal_archive/%f'
archive_timeout = 300

# Checkpoint settings
checkpoint_timeout = 15min
checkpoint_completion_target = 0.9
max_wal_size = 4GB
min_wal_size = 1GB

# =============================================================================
# QUERY TUNING
# =============================================================================
random_page_cost = 1.1  # For SSD storage
effective_io_concurrency = 200
default_statistics_target = 100
constraint_exclusion = partition

# =============================================================================
# WRITE PERFORMANCE
# =============================================================================
synchronous_commit = on
wal_compression = on
wal_buffers = 16MB
commit_delay = 0
commit_siblings = 5

# =============================================================================
# BACKGROUND WRITER
# =============================================================================
bgwriter_delay = 200ms
bgwriter_lru_maxpages = 100
bgwriter_lru_multiplier = 2.0

# =============================================================================
# AUTOVACUUM
# =============================================================================
autovacuum = on
autovacuum_max_workers = 4
autovacuum_naptime = 1min
autovacuum_vacuum_threshold = 50
autovacuum_analyze_threshold = 50
autovacuum_vacuum_scale_factor = 0.05
autovacuum_analyze_scale_factor = 0.02
autovacuum_vacuum_cost_delay = 10ms
autovacuum_vacuum_cost_limit = 1000

# =============================================================================
# LOGGING
# =============================================================================
logging_collector = on
log_directory = '/var/log/postgresql'
log_filename = 'postgresql-%Y-%m-%d_%H%M%S.log'
log_rotation_age = 1d
log_rotation_size = 100MB
log_truncate_on_rotation = on

# What to log
log_min_duration_statement = 1000  # Log queries > 1 second
log_checkpoints = on
log_connections = on
log_disconnections = on
log_lock_waits = on
log_temp_files = 0
log_autovacuum_min_duration = 0
log_line_prefix = '%t [%p]: [%l-1] user=%u,db=%d,app=%a,client=%h '

# =============================================================================
# STATISTICS
# =============================================================================
track_activities = on
track_counts = on
track_io_timing = on
track_functions = all
stats_temp_directory = '/var/run/postgresql/stats_tmp'

# =============================================================================
# SECURITY
# =============================================================================
ssl = on
ssl_cert_file = '/etc/postgresql/ssl/server.crt'
ssl_key_file = '/etc/postgresql/ssl/server.key'
ssl_ca_file = '/etc/postgresql/ssl/ca.crt'
ssl_prefer_server_ciphers = on

password_encryption = scram-sha-256

# =============================================================================
# REPLICATION
# =============================================================================
hot_standby = on
hot_standby_feedback = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s

# Synchronous replication (at least one synchronous replica)
synchronous_standby_names = 'FIRST 1 (replica_1, replica_2)'

# =============================================================================
# PARALLEL QUERY
# =============================================================================
max_parallel_workers_per_gather = 4
max_parallel_workers = 8
max_worker_processes = 8
parallel_leader_participation = on

# =============================================================================
# ADVANCED OPTIONS
# =============================================================================
shared_preload_libraries = 'pg_stat_statements'
pg_stat_statements.track = all
pg_stat_statements.max = 10000

# Timezone
timezone = 'UTC'
log_timezone = 'UTC'

# Locale
lc_messages = 'en_US.UTF-8'
lc_monetary = 'en_US.UTF-8'
lc_numeric = 'en_US.UTF-8'
lc_time = 'en_US.UTF-8'

# Default text search configuration
default_text_search_config = 'pg_catalog.english'
