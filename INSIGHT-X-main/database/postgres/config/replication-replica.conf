# PostgreSQL Replica Server Configuration
# This file should be created as recovery.conf or postgresql.auto.conf on replica

# Standby mode
standby_mode = 'on'

# Primary connection info
primary_conninfo = 'host=postgres-primary port=5432 user=replicator password=${REPLICATION_PASSWORD} application_name=replica_1'
primary_slot_name = 'replica_1_slot'

# Recovery settings
restore_command = 'aws s3 cp s3://insightx-postgres-wal-archive/%f %p --region us-east-1'
recovery_target_timeline = 'latest'

# Hot standby
hot_standby = on
hot_standby_feedback = on
max_standby_archive_delay = 30s
max_standby_streaming_delay = 30s

# Promotion trigger file
promote_trigger_file = '/tmp/postgresql.trigger.5432'

# Standby connection timeout
wal_receiver_timeout = 60s
wal_receiver_status_interval = 10s
wal_retrieve_retry_interval = 5s
