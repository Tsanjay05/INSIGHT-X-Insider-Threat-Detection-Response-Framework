# PostgreSQL Primary Server Replication Configuration
# Include this in postgresql.conf on the primary server

# Enable WAL archiving for point-in-time recovery
wal_level = replica
archive_mode = on
archive_command = 'aws s3 cp %p s3://insightx-postgres-wal-archive/%f --region us-east-1'
archive_timeout = 300

# Replication settings
max_wal_senders = 10
wal_keep_size = 1GB
max_replication_slots = 10

# Synchronous replication
synchronous_standby_names = 'FIRST 1 (replica_1, replica_2)'
synchronous_commit = on

# Allow hot standby feedback from replicas
hot_standby_feedback = on

# WAL sender timeout
wal_sender_timeout = 60s

# Replication monitoring
track_commit_timestamp = on
