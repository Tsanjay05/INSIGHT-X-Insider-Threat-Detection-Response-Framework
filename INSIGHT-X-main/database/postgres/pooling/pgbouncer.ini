# PgBouncer Configuration for INSIGHT-X
# Transaction pooling mode for optimal connection management

# =============================================================================
# DATABASE CONNECTIONS
# =============================================================================
[databases]
insightx_trust = host=postgres-primary port=5432 dbname=insightx_trust user=insightx_app password=${POSTGRES_APP_PASSWORD}

# =============================================================================
# PGBOUNCER SETTINGS
# =============================================================================
[pgbouncer]

# Connection pooling mode
# transaction = recommended for most applications
# session = for applications that use SET commands
# statement = for very simple applications
pool_mode = transaction

# Listen address
listen_addr = 0.0.0.0
listen_port = 6432

# Authentication
auth_type = scram-sha-256
auth_file = /etc/pgbouncer/userlist.txt

# Connection limits
max_client_conn = 1000
default_pool_size = 25
min_pool_size = 10
reserve_pool_size = 5
reserve_pool_timeout = 5

# Server connection limits
max_db_connections = 100
max_user_connections = 100

# ==============================================================================
# TIMEOUTS
# =============================================================================
server_lifetime = 3600          # Close server connection after this time (seconds)
server_idle_timeout = 600       # Close server connection if idle this long
server_connect_timeout = 15     # Timeout for connecting to server
server_login_retry = 15         # Retry connecting to server after this time

query_timeout = 0               # Query timeout (0 = disabled)
query_wait_timeout = 120        # Max time queries can wait for connection
client_idle_timeout = 0         # Close client connection if idle (0 = disabled)

# =============================================================================
# POOLING BEHAVIOR
# =============================================================================
server_check_delay = 30         # Check server health every 30 seconds
server_check_query = SELECT 1   # Query to check server health

# Close server connection when client closes connection  
server_reset_query = DISCARD ALL
server_reset_query_always = 0

# Don't poll server for notifications
disable_pqexec = 0

# =============================================================================
# LOGGING
# =============================================================================
logfile = /var/log/pgbouncer/pgbouncer.log
pidfile = /var/run/pgbouncer/pgbouncer.pid

# Log verbosity
log_connections = 1
log_disconnections = 1
log_pooler_errors = 1
log_stats = 1
stats_period = 60

# Syslog integration
syslog = 0
syslog_facility = daemon
syslog_ident = pgbouncer

# =============================================================================
# PERFORMANCE
# =============================================================================
pkt_buf = 8192
max_packet_size = 2147483647
listen_backlog = 128
sbuf_loopcnt = 5

# TCP settings
so_reuseport = 1
tcp_keepalive = 1
tcp_keepidle = 600
tcp_keepintvl = 10
tcp_keepcnt = 5
tcp_user_timeout = 60000

# =============================================================================
# SECURITY
# =============================================================================
unix_socket_dir = /var/run/pgbouncer
unix_socket_mode = 0777

# Admin users (can run admin commands)
admin_users = pgbouncer_admin

# Stats users (can view stats)
stats_users = prometheus, pgbouncer_admin

# Application database
application_name_add_host = 1

# =============================================================================
# MONITORING
# =============================================================================
# PgBouncer exposes stats via SHOW commands:
# - SHOW STATS;        (connection statistics)
# - SHOW POOLS;        (pool status)
# - SHOW DATABASES;    (database configuration)
# - SHOW CLIENTS;      (active client connections)
# - SHOW SERVERS;      (server connections)
# - SHOW SOCKETS;      (internal socket state)
# - SHOW LISTS;        (internal data structures)
# - SHOW MEM;          (memory usage)

# Connect to admin database:
# psql -h localhost -p 6432 -U pgbouncer_admin pgbouncer
