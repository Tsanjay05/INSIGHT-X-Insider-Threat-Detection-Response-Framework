apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Values.global.namespace | default "insightx" }}
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: insightx
  template:
    metadata:
      labels:
        app: insightx
    spec:
      containers:
        - name: insightx
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
