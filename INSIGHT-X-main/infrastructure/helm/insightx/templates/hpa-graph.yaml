{{- if and .Values.graph.enabled .Values.graph.autoscaling.enabled }}
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: {{ include "insightx.fullname" . }}-graph
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insightx.labels" . | nindent 4 }}
    app.kubernetes.io/component: graph
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: {{ include "insightx.fullname" . }}-graph
  minReplicas: {{ .Values.graph.autoscaling.minReplicas }}
  maxReplicas: {{ .Values.graph.autoscaling.maxReplicas }}
  metrics:
  - type: Resource
    resource:
      name: cpu
      target:
        type: Utilization
        averageUtilization: {{ .Values.graph.autoscaling.targetCPUUtilizationPercentage }}
  {{- if .Values.graph.autoscaling.targetMemoryUtilizationPercentage }}
  - type: Resource
    resource:
      name: memory
      target:
        type: Utilization
        averageUtilization: {{ .Values.graph.autoscaling.targetMemoryUtilizationPercentage }}
  {{- end }}
  behavior:
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
      - type: Percent
        value: 50
        periodSeconds: 60
      selectPolicy: Min
    scaleUp:
      stabilizationWindowSeconds: 0
      policies:
      - type: Percent
        value: 100
        periodSeconds: 30
      selectPolicy: Max
{{- end }}
