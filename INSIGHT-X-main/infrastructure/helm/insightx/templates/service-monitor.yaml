{{- if .Values.observability.metrics.serviceMonitor.enabled }}
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ include "insightx.fullname" . }}-ingestion
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "insightx.labels" . | nindent 4 }}
    app.kubernetes.io/component: ingestion
spec:
  selector:
    matchLabels:
      app.kubernetes.io/component: ingestion
  endpoints:
  - port: metrics
    interval: {{ .Values.observability.metrics.serviceMonitor.interval }}
    scrapeTimeout: {{ .Values.observability.metrics.serviceMonitor.scrapeTimeout }}
    path: /actuator/prometheus

