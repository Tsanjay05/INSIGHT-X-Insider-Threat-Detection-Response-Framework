# INSIGHT-X Kafka Quotas Configuration
# Prevent resource exhaustion and ensure fair usage

quotas:
  # Producer Quotas
  - entity:
      type: client-id
      name: insightx-ingestion
    limits:
      producer_byte_rate: 10485760  # 10 MB/s
      request_percentage: 50  # % of broker CPU/IO time

  - entity:
      type: client-id
      name: insightx-trust-engine
    limits:
      producer_byte_rate: 5242880  # 5 MB/s
      request_percentage: 30

  # Consumer Quotas
  - entity:
      type: client-id
      name: insightx-trust-engine
    limits:
      consumer_byte_rate: 20971520  # 20 MB/s
      request_percentage: 50

  - entity:
      type: client-id
      name: insightx-intent
    limits:
      consumer_byte_rate: 10485760  # 10 MB/s
      request_percentage: 30

  - entity:
      type: client-id
      name: insightx-graph
    limits:
      consumer_byte_rate: 10485760  # 10 MB/s
      request_percentage: 30

  - entity:
      type: client-id
      name: insightx-provenance
    limits:
      consumer_byte_rate: 20971520  # 20 MB/s
      request_percentage: 40

  # Default Quota (for any unspecified clients)
  - entity:
      type: client-id
      name: __default
    limits:
      producer_byte_rate: 1048576  # 1 MB/s
      consumer_byte_rate: 2097152  # 2 MB/s
      request_percentage: 10

  # User-based Quotas (if needed for debugging tools)
  - entity:
      type: user
      name: __default
    limits:
      producer_byte_rate: 1048576
      consumer_byte_rate: 2097152
      request_percentage: 10
