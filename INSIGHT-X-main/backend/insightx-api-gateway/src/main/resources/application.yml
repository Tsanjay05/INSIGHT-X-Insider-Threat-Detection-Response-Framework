server:
  port: 8080

spring:
  application:
    name: insightx-api-gateway
  cloud:
    gateway:
      routes:
        # Intent Service (Hypothesis Management)
        - id: intent-service
          uri: http://localhost:8083
          predicates:
            - Path=/api/v1/intent/**,/api/intent/**
          filters:
            - RewritePath=/api/v1/intent/(?<segment>.*), /api/intent/${segment}
        # Graph Service (Kill Chain & Campaigns)
        - id: graph-service
          uri: http://localhost:8087
          predicates:
            - Path=/api/v1/graph/**,/api/graph/**
          filters:
            - RewritePath=/api/v1/graph/(?<segment>.*), /api/graph/${segment}
        # Provenance Service (Audit Trail)
        - id: provenance-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/provenance/**,/api/provenance/**
          filters:
            - RewritePath=/api/v1/provenance/(?<segment>.*), /api/provenance/${segment}
        # Audit Trail
        - id: audit-service
          uri: http://localhost:8085
          predicates:
            - Path=/api/v1/audit/**,/api/audit/**
          filters:
            - RewritePath=/api/v1/audit/(?<segment>.*), /api/audit/${segment}
        # Trust Engine
        - id: trust-engine
          uri: http://localhost:8082
          predicates:
            - Path=/api/v1/trust/**,/api/trust/**
          filters:
            - RewritePath=/api/v1/trust/(?<segment>.*), /api/trust/${segment}
        # Controls Service
        - id: controls-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/controls/**,/api/controls/**
          filters:
            - RewritePath=/api/v1/controls/(?<segment>.*), /api/controls/${segment}
        # Approvals API (aliases to controls approvals)
        - id: approvals-service
          uri: http://localhost:8084
          predicates:
            - Path=/api/v1/approvals/**,/api/approvals/**
          filters:
            - RewritePath=/api/v1/approvals/(?<segment>.*), /api/controls/approvals/${segment}
            - RewritePath=/api/approvals/(?<segment>.*), /api/controls/approvals/${segment}
        # Ingestion Service
        - id: ingestion-service
          uri: http://localhost:8086
          predicates:
            - Path=/api/v1/ingestion/**,/api/ingestion/**
          filters:
            - RewritePath=/api/v1/ingestion/(?<segment>.*), /api/ingestion/${segment}
        # Stream Gateway (SSE)
        - id: stream-gateway
          uri: http://localhost:8088
          predicates:
            - Path=/stream/**

logging:
  level:
    com.insightx.gateway: INFO
    org.springframework.web: INFO
