spring:
  kafka:
    bootstrap-servers: kafka:9092
    properties:
      reconnect.backoff.ms: 1000
      reconnect.backoff.max.ms: 10000
      connections.max.idle.ms: 540000
      request.timeout.ms: 30000
    consumer:
      properties:
        session.timeout.ms: 30000
        heartbeat.interval.ms: 10000
    producer:
      properties:
        max.block.ms: 30000
  r2dbc:
    url: r2dbc:postgresql://postgres:5432/insightx_provenance
    username: insightx
    password: password
    pool:
      initial-size: 5
      max-size: 10
      max-idle-time: 30m
      validation-query: SELECT 1
  flyway:
    url: jdbc:postgresql://postgres:5432/insightx_provenance
    user: insightx
    password: password
